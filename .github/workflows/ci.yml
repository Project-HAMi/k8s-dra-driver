name: "CI"

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'demo/**'
      - 'imgs/**'
  pull_request:
    branches: [ main ]
    types:
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - 'README.md'
      - 'demo/**'
      - 'imgs/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        submodules: recursive
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: '1.25.1'

    - name: Build
      run: make build

    - name: Test
      run: make test

    - name: golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
      with:
        version: v2.6
