name: "Image"

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - '.github/workflows/image.yml'
      - 'api/**'
      - 'common.mk'
      - 'deploy/container/**'
      - 'cmd/**'
      - 'pkg/**'
      - 'internal/**'
      - 'lib/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'versions.mk'
      - 'hack/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      monitor_source:
        description: 'Monitor source: source (HAMi Git) or image (release extraction)'
        required: false
        type: choice
        options:
          - source
          - image
      monitor_ref:
        description: 'HAMi branch, tag or commit; defaults to master'
        required: false
        type: string
      monitor_image:
        description: 'Compatible HAMi monitor image (tag or digest); defaults to repository variable HAMI_VGPUMONITOR_IMAGE'
        required: false
        type: string

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      HAMI_VGPUMONITOR_SOURCE: ${{ inputs.monitor_source || vars.HAMI_VGPUMONITOR_SOURCE || 'source' }}
      HAMI_VGPUMONITOR_REF: ${{ inputs.monitor_ref || vars.HAMI_VGPUMONITOR_REF || 'master' }}
      HAMI_VGPUMONITOR_IMAGE: ${{ inputs.monitor_image || vars.HAMI_VGPUMONITOR_IMAGE || 'scratch' }}
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        submodules: recursive
        persist-credentials: false

    - name: Prepare image name
      id: prep
      shell: bash
      run: |
        version="$(make print-VERSION)"
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          version="${GITHUB_REF_NAME}"
        fi

        {
          echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "version=${version}"
        } >> "${GITHUB_OUTPUT}"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Extract image metadata
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
      with:
        images: ${{ steps.prep.outputs.image_name }}
        tags: |
          type=raw,value=main,enable={{is_default_branch}}
          type=ref,event=tag
          type=sha,format=short,prefix=sha-
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

    - name: Log in to GHCR
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Load build arguments
      id: args
      shell: bash
      run: |
        make -f deploy/container/Makefile validate-monitor-image
        {
          echo "golang_version=$(make print-GOLANG_VERSION)"
          echo "bash_static_git_ref=$(make print-BASH_STATIC_GIT_REF)"
          echo "toolkit_container_image=$(make print-TOOLKIT_CONTAINER_IMAGE)"
          echo "hami_core_build_image=$(make print-HAMI_CORE_BUILD_IMAGE)"
          echo "hami_vgpumonitor_source=$(make print-HAMI_VGPUMONITOR_SOURCE)"
          echo "hami_vgpumonitor_ref=$(make print-HAMI_VGPUMONITOR_REF)"
          echo "hami_vgpumonitor_image=$(make print-HAMI_VGPUMONITOR_IMAGE)"
          echo "git_commit=$(make print-GIT_COMMIT)"
        } >> "${GITHUB_OUTPUT}"

    - name: Build and push image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        file: deploy/container/Dockerfile
        platforms: linux/amd64
        push: true
        provenance: false
        sbom: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          GOLANG_VERSION=${{ steps.args.outputs.golang_version }}
          BASH_STATIC_GIT_REF=${{ steps.args.outputs.bash_static_git_ref }}
          TOOLKIT_CONTAINER_IMAGE=${{ steps.args.outputs.toolkit_container_image }}
          HAMI_CORE_BUILD_IMAGE=${{ steps.args.outputs.hami_core_build_image }}
          HAMI_VGPUMONITOR_SOURCE=${{ steps.args.outputs.hami_vgpumonitor_source }}
          HAMI_VGPUMONITOR_REF=${{ steps.args.outputs.hami_vgpumonitor_ref }}
          HAMI_VGPUMONITOR_IMAGE=${{ steps.args.outputs.hami_vgpumonitor_image }}
          VERSION=${{ steps.prep.outputs.version }}
          GIT_COMMIT=${{ steps.args.outputs.git_commit }}
