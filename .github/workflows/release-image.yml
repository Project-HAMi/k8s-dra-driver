name: "Release Image"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签 (例如: v1.0.0, latest, dev)'
        required: true
        default: 'latest'
        type: string
      monitor_source:
        description: 'Monitor source: source (HAMi Git) or image (release extraction)'
        required: false
        type: choice
        options:
          - source
          - image
      monitor_ref:
        description: 'HAMi branch, tag or commit; defaults to master'
        required: false
        type: string
      monitor_image:
        description: 'Compatible HAMi monitor image (tag or digest); defaults to repository variable HAMI_VGPUMONITOR_IMAGE'
        required: false
        type: string

permissions:
  contents: read

jobs:
  image:
    env:
      IMAGE_NAME: ${{ 'projecthami/k8s-dra-driver' }}
      HAMI_VGPUMONITOR_SOURCE: ${{ inputs.monitor_source || vars.HAMI_VGPUMONITOR_SOURCE || 'source' }}
      HAMI_VGPUMONITOR_REF: ${{ inputs.monitor_ref || vars.HAMI_VGPUMONITOR_REF || 'master' }}
      HAMI_VGPUMONITOR_IMAGE: ${{ inputs.monitor_image || vars.HAMI_VGPUMONITOR_IMAGE || 'scratch' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        submodules: recursive
        persist-credentials: false

    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      with:
        image: tonistiigi/binfmt:qemu-v7.0.0-28

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Docker Login
      uses: docker/login-action@e92390c5fb421da1463c202d546fed0ec5c39f20 # v3.1.0
      with:
        username: ${{ secrets.DOCKERHUB_TOKEN }}
        password: ${{ secrets.DOCKERHUB_PASSWD }}

    - name: Prepare build arguments
      id: args
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      shell: bash
      run: |
        if [[ ! "${RELEASE_TAG}" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
          echo "::error::Release tag must be a valid Docker tag (1-128 letters, digits, underscores, dots or hyphens; starting with a letter, digit or underscore)."
          exit 1
        fi
        version="${RELEASE_TAG}"
        make -f deploy/container/Makefile validate-monitor-image
        {
          echo "version=${version}"
          echo "golang_version=$(make print-GOLANG_VERSION)"
          echo "bash_static_git_ref=$(make print-BASH_STATIC_GIT_REF)"
          echo "toolkit_container_image=$(make print-TOOLKIT_CONTAINER_IMAGE)"
          echo "hami_core_build_image=$(make print-HAMI_CORE_BUILD_IMAGE)"
          echo "hami_vgpumonitor_source=$(make print-HAMI_VGPUMONITOR_SOURCE)"
          echo "hami_vgpumonitor_ref=$(make print-HAMI_VGPUMONITOR_REF)"
          echo "hami_vgpumonitor_image=$(make print-HAMI_VGPUMONITOR_IMAGE)"
          echo "git_commit=$(make print-GIT_COMMIT)"
        } >> "${GITHUB_OUTPUT}"

    - name: Build and push image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        file: deploy/container/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        provenance: false
        sbom: false
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          GOLANG_VERSION=${{ steps.args.outputs.golang_version }}
          BASH_STATIC_GIT_REF=${{ steps.args.outputs.bash_static_git_ref }}
          TOOLKIT_CONTAINER_IMAGE=${{ steps.args.outputs.toolkit_container_image }}
          HAMI_CORE_BUILD_IMAGE=${{ steps.args.outputs.hami_core_build_image }}
          HAMI_VGPUMONITOR_SOURCE=${{ steps.args.outputs.hami_vgpumonitor_source }}
          HAMI_VGPUMONITOR_REF=${{ steps.args.outputs.hami_vgpumonitor_ref }}
          HAMI_VGPUMONITOR_IMAGE=${{ steps.args.outputs.hami_vgpumonitor_image }}
          VERSION=${{ steps.args.outputs.version }}
          GIT_COMMIT=${{ steps.args.outputs.git_commit }}
        tags: ${{ env.IMAGE_NAME }}:${{ github.event.inputs.tag }}
