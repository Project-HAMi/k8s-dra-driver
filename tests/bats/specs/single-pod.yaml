apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: single-gpu
  labels:
    env: batssuite
spec:
  devices:
    requests:
    - name: gpu
      exactly:
        deviceClassName: hami-core-gpu.project-hami.io
        capacity:
          requests:
            cores: 30
            memory: 4Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-single-gpu
  labels:
    env: batssuite
spec:
  containers:
  - name: ctr
    image: ubuntu:24.04
    command: ["bash", "-c"]
    args: ["trap 'exit 0' TERM; sleep 9999 & wait"]
    resources:
      claims:
      - name: gpu
  resourceClaims:
  - name: gpu
    resourceClaimName: single-gpu
