# Two pods on GPU 0 that together take all of its cores and memory.
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: shared-a
  labels:
    env: batssuite
spec:
  devices:
    requests:
    - name: gpu
      exactly:
        deviceClassName: hami-core-gpu.project-hami.io
        selectors:
        - cel:
            expression: device.attributes["hami-core-gpu.project-hami.io"].minor == 0
        capacity:
          requests:
            cores: 30
            memory: 4Gi
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: shared-b
  labels:
    env: batssuite
spec:
  devices:
    requests:
    - name: gpu
      exactly:
        deviceClassName: hami-core-gpu.project-hami.io
        selectors:
        - cel:
            expression: device.attributes["hami-core-gpu.project-hami.io"].minor == 0
        capacity:
          requests:
            cores: 70
            memory: 12Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-shared-a
  labels:
    env: batssuite
spec:
  containers:
  - name: ctr
    image: ubuntu:24.04
    command: ["bash", "-c"]
    args: ["trap 'exit 0' TERM; sleep 9999 & wait"]
    resources:
      claims:
      - name: gpu
  resourceClaims:
  - name: gpu
    resourceClaimName: shared-a
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-shared-b
  labels:
    env: batssuite
spec:
  containers:
  - name: ctr
    image: ubuntu:24.04
    command: ["bash", "-c"]
    args: ["trap 'exit 0' TERM; sleep 9999 & wait"]
    resources:
      claims:
      - name: gpu
  resourceClaims:
  - name: gpu
    resourceClaimName: shared-b
